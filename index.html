<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Shift</title>
<style>
  :root {
    --bg: #0b1020; --card: rgba(21, 27, 49, .9); --text: #e8ecf8; --muted: #8e98b8;
    --accent: #7aa2ff; --good: #6fdc9b; --line: #252d4a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .daybar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .daybar button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; width: 44px; height: 44px; font-size: 1.2rem;
  }
  .daybar .date { flex: 1; text-align: center; font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .card.below { background: rgba(21, 27, 49, .6); }
  .card.below > * { opacity: .45; filter: grayscale(.8); }
  .card { display: flex; gap: 14px; align-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .card .info { flex: 1; min-width: 0; }
  .card svg { width: 48px; height: 48px; flex: none; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .name { font-weight: 600; font-size: 1.1rem; }
  .peak { color: var(--muted); font-size: .85rem; }
  .range { margin-top: 6px; font-variant-numeric: tabular-nums; }
  .day { color: var(--muted); font-size: .75rem; margin-left: 3px; }
  .phase { color: var(--muted); font-size: .85rem; }
  .none { color: var(--muted); margin-top: 6px; }
  .msg { color: var(--muted); text-align: center; padding: 24px 0; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; padding: 0 0 0 6px; cursor: pointer; }
  dialog {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px 16px; width: min(92vw, 420px);
  }
  dialog::backdrop { background: rgba(5, 8, 18, .7); }
  dialog h2 { font-size: 1.1rem; margin: 0 0 4px; }
  dialog form { margin-top: 10px; }
  #manual .cancel { display: none; }
  dialog #manual .cancel { display: inline-block; }
  form .ghost { background: none; color: var(--accent); border: 1px solid var(--line); }
  form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  input {
    flex: 1; min-width: 120px; background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px;
  }
  form button {
    background: var(--accent); color: #0b1020; border: 0; border-radius: 10px;
    padding: 10px 16px; font-weight: 600; font-size: 16px;
  }

  /* ---------- Animated sky background ---------- */
  #sky {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 15% 10%, rgba(88, 70, 160, .28), transparent 70%),
      radial-gradient(ellipse 70% 45% at 90% 85%, rgba(40, 90, 160, .25), transparent 70%),
      radial-gradient(ellipse 60% 40% at 70% 35%, rgba(150, 60, 120, .12), transparent 70%),
      var(--bg);
  }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out var(--delay) infinite;
  }
  .star.big { box-shadow: 0 0 6px 1px rgba(200, 220, 255, .7); }
  @keyframes twinkle {
    0%, 100% { opacity: var(--lo); transform: scale(.8); }
    50%      { opacity: 1;        transform: scale(1.1); }
  }
  .shoot {
    position: absolute; width: 140px; height: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(200,220,255,.9) 70%, #fff);
    border-radius: 2px; filter: drop-shadow(0 0 4px rgba(170,200,255,.9));
    transform: rotate(var(--angle)) translateX(0);
    animation: shoot var(--d) linear var(--delay) infinite;
  }
  /* Only the first ~7% of each cycle is visible, so streaks are occasional. */
  @keyframes shoot {
    0%   { opacity: 0; transform: rotate(var(--angle)) translateX(0); }
    1%   { opacity: 1; }
    6%   { opacity: 0; transform: rotate(var(--angle)) translateX(var(--dist)); }
    100% { opacity: 0; transform: rotate(var(--angle)) translateX(var(--dist)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; opacity: .7; }
    .shoot { display: none; }
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main>
  <h1>Night Shift</h1>
  <div class="sub"><span id="loc">Locating…</span>
    <button type="button" id="change" class="link" hidden>Change</button></div>
  <div class="daybar">
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="date" id="date"></div>
    <button id="next" aria-label="Next day">›</button>
  </div>
  <div class="sub" id="night"></div>
  <div id="out"><div class="msg">Waiting for location…</div></div>
  <div id="manualSlot">
  <form id="manual" hidden>
    <input id="lat" inputmode="decimal" placeholder="Latitude">
    <input id="lon" inputmode="decimal" placeholder="Longitude">
    <button>Use</button>
    <button type="button" id="gps" class="ghost">Use my location</button>
    <button type="button" id="cancel" class="ghost cancel">Cancel</button>
  </form>
  </div>
</main>

<dialog id="locDialog">
  <h2>Change location</h2>
  <div class="sub">Latitude and longitude in degrees.</div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
// Build the twinkling star field and a few shooting stars.
(function buildSky() {
  const sky = document.getElementById('sky');
  const rand = (a, b) => a + Math.random() * (b - a);
  const count = Math.round(Math.min(300, window.innerWidth * window.innerHeight / 2800));
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    const size = Math.random() < .08 ? rand(2, 3) : rand(.6, 1.6);
    el.className = 'star' + (size > 2 ? ' big' : '');
    el.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 100)}%;width:${size}px;height:${size}px;` +
      `--d:${rand(2.5, 7).toFixed(2)}s;--delay:${rand(-7, 0).toFixed(2)}s;--lo:${rand(.25, .6).toFixed(2)}`;
    frag.append(el);
  }
  for (let i = 0; i < 3; i++) {
    const el = document.createElement('span');
    el.className = 'shoot';
    const place = () => {
      el.style.left = rand(-10, 70) + '%';
      el.style.top = rand(-5, 45) + '%';
      el.style.setProperty('--angle', rand(20, 45).toFixed(0) + 'deg');
    };
    place();
    el.style.setProperty('--dist', rand(500, 900).toFixed(0) + 'px');
    el.style.setProperty('--d', rand(9, 18).toFixed(1) + 's');
    el.style.setProperty('--delay', (2 + i * rand(3, 6)).toFixed(1) + 's');
    el.addEventListener('animationiteration', place);   // new spot each pass
    frag.append(el);
  }
  sky.append(frag);
})();

const PLANETS = ['Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
// Simple illustrated planets: [base color, highlight, band color or null].
const LOOKS = {
  Mercury: ['#8c8580', '#c9c2bb', null],
  Venus:   ['#d9b36c', '#f6e2b0', null],
  Mars:    ['#b5482a', '#e8865c', null],
  Jupiter: ['#c89b6d', '#f1d9b8', '#9c6b45'],
  Saturn:  ['#d8bd7f', '#f5e6bd', '#b89a5c'],
  Uranus:  ['#7fc7cf', '#c8f1f3', null],
  Neptune: ['#3f63c9', '#8fb0ff', null],
};

const PHASES = ['New Moon', 'Waxing Crescent', 'First Quarter', 'Waxing Gibbous',
  'Full Moon', 'Waning Gibbous', 'Last Quarter', 'Waning Crescent'];

// Phase angle: 0 = new, 90 = first quarter, 180 = full, 270 = last quarter.
function moonInfo(date) {
  const angle = Astronomy.MoonPhase(date);
  const lit = (1 - Math.cos(angle * Math.PI / 180)) / 2;
  // Principal phases (new, quarters, full) only within ~1 day of exact.
  const near = Math.round(angle / 90) % 4;
  const name = Math.abs(angle - Math.round(angle / 90) * 90) < 12 ? PHASES[near * 2]
             : PHASES[Math.floor(angle / 90) * 2 + 1];
  return { angle, lit, name };
}

function moonIcon(angle) {
  const r = 18, waxing = angle < 180;
  const a = waxing ? angle : 360 - angle;           // 0..180, how far from new
  const rx = r * Math.abs(Math.cos(a * Math.PI / 180));
  const sweep = a < 90 ? 0 : 1;                      // crescent vs gibbous terminator
  const lit = `<path d="M24 ${24 - r} A${r} ${r} 0 0 1 24 ${24 + r} A${rx} ${r} 0 0 ${sweep} 24 ${24 - r}Z"
    fill="url(#gMoon)" ${waxing ? '' : 'transform="translate(48 0) scale(-1 1)"'}/>`;
  return `<svg viewBox="0 0 48 48" aria-hidden="true">
    <defs><radialGradient id="gMoon" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#f4f1e8"/><stop offset="1" stop-color="#c9c4b5"/></radialGradient></defs>
    <circle cx="24" cy="24" r="${r}" fill="#2a3150"/>${lit}</svg>`;
}

function planetIcon(p) {
  if (p === 'Moon') return moonIcon(moonInfo(midNight()).angle);
  const [base, hi, band] = LOOKS[p];
  const id = 'g' + p;
  const bands = band ? `<g clip-path="url(#c${p})" opacity=".55">
      <rect x="0" y="17" width="48" height="3" fill="${band}"/>
      <rect x="0" y="24" width="48" height="4" fill="${band}"/>
      <rect x="0" y="31" width="48" height="2" fill="${band}"/></g>` : '';
  const ring = p === 'Saturn';
  const r = ring ? 13 : 18;
  const ringBack = ring ? `<ellipse cx="24" cy="24" rx="23" ry="6" fill="none" stroke="#e8d7a8" stroke-width="2.5" opacity=".9"/>` : '';
  const ringFront = ring ? `<path d="M1 24 A23 6 0 0 0 47 24" fill="none" stroke="#e8d7a8" stroke-width="2.5"/>` : '';
  return `<svg viewBox="0 0 48 48" aria-hidden="true">
    <defs><radialGradient id="${id}" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="${hi}"/><stop offset="1" stop-color="${base}"/></radialGradient>
      <clipPath id="c${p}"><circle cx="24" cy="24" r="${r}"/></clipPath></defs>
    ${ringBack}<circle cx="24" cy="24" r="${r}" fill="url(#${id})"/>${bands}${ringFront}</svg>`;
}

const MIN_ALT = 30;
const STEP_MIN = 2;

let observer = null;
// The window runs from sunset on the selected day to the next sunrise, so each
// planet gets one continuous range for the night. Falls back to noon–noon
// where the Sun doesn't set or rise (polar summer/winter).
let day = startOfDay(new Date());
let win = null;
function midNight() { return new Date((win.start.getTime() + win.end.getTime()) / 2); }

function computeWindow() {
  const noon = new Date(day); noon.setHours(12);
  const set = Astronomy.SearchRiseSet('Sun', observer, -1, noon, 1);
  const rise = set && Astronomy.SearchRiseSet('Sun', observer, +1, set.date, 1);
  win = set && rise ? { start: set.date, end: rise.date, sun: true }
                    : { start: noon, end: addMin(noon, 24 * 60), sun: false };
}

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addMin(d, m) { return new Date(d.getTime() + m * 60000); }
function fmt(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

function altitude(body, date) {
  const eq = Astronomy.Equator(body, date, observer, true, true);
  return Astronomy.Horizon(date, observer, eq.ra, eq.dec, 'normal').altitude;
}

// Sample the day and return contiguous intervals where predicate holds.
function intervals(test) {
  const out = [];
  let start = null;
  for (let t = win.start; ; t = addMin(t, STEP_MIN)) {
    const last = t >= win.end;
    if (last) t = win.end;
    const ok = test(t);
    if (ok && !start) start = t;
    if ((!ok || last) && start) { out.push([start, ok ? t : addMin(t, -STEP_MIN)]); start = null; }
    if (last) break;
  }
  return out;
}

function shortDay(d) { return d.toLocaleDateString([], { weekday: 'short' }); }

function fmtRange(s, e) {
  const crosses = e.getDate() !== day.getDate();
  const tag = d => crosses ? `<span class="day">${shortDay(d)}</span>` : '';
  return `${fmt(s)}${tag(s)} – ${fmt(e)}${tag(e)}`;
}

function render() {
  const next = addMin(day, 36 * 60);
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  document.getElementById('date').textContent =
    `${day.toLocaleDateString([], opts)} → ${next.toLocaleDateString([], { weekday: 'short' })}`;
  if (!observer) return;
  computeWindow();
  document.getElementById('night').textContent = win.sun
    ? `Sunset ${fmt(win.start)} · Sunrise ${fmt(win.end)}` : 'No sunset tonight · showing noon to noon';

  const cards = PLANETS.map(p => {
    const up = intervals(t => altitude(p, t) >= MIN_ALT);
    let peak = -90;
    for (let t = win.start; t <= win.end; t = addMin(t, 10)) peak = Math.max(peak, altitude(p, t));
    const moon = p === 'Moon' ? moonInfo(midNight()) : null;
    const phase = moon ? `<div class="phase">${moon.name} · ${Math.round(moon.lit * 100)}% lit</div>` : '';
    const body = phase + (up.length
      ? up.map(([s, e]) => `<div class="range">${fmtRange(s, e)}</div>`).join('')
      : `<div class="none">Not above ${MIN_ALT}° tonight</div>`);
    return { first: up.length ? up[0][0] : Infinity, html: `<div class="card${up.length ? '' : ' below'}">${planetIcon(p)}<div class="info"><div class="row"><span class="name">${p}</span>
      <span class="peak">max ${Math.floor(peak)}°</span></div>${body}</div></div>` };
  });
  cards.sort((a, b) => a.first - b.first);
  document.getElementById('out').innerHTML = cards.map(c => c.html).join('');
}

const STORE_KEY = 'planetarium.location';

function loadSaved() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY));
    return v && isFinite(v.lat) && isFinite(v.lon) ? v : null;
  } catch { return null; }
}
function save(v) {
  try { v ? localStorage.setItem(STORE_KEY, JSON.stringify(v)) : localStorage.removeItem(STORE_KEY); } catch {}
}

const $ = id => document.getElementById(id);
let current = null;

// The lat/long form lives at the bottom of the page only while no location is
// set; afterwards it's moved into the "Change" dialog.
function showFormInline() {
  closeDialog();
  $('manualSlot').append($('manual'));
  $('manual').hidden = false;
  $('change').hidden = true;
}

function openDialog() {
  if (current) { $('lat').value = current.lat; $('lon').value = current.lon; }
  $('locDialog').append($('manual'));
  $('manual').hidden = false;
  $('locDialog').showModal();
}

function closeDialog() {
  if ($('locDialog').open) $('locDialog').close();
}

function setLocation(lat, lon, manual) {
  current = { lat, lon };
  closeDialog();
  $('manual').hidden = true;
  $('change').hidden = false;
  observer = new Astronomy.Observer(lat, lon, 0);
  document.getElementById('loc').textContent =
    `${lat.toFixed(3)}°, ${lon.toFixed(3)}°${manual ? ' (saved)' : ''} · local times`;
  render();
}

function fillForm() {
  const saved = loadSaved();
  if (saved) {
    document.getElementById('lat').value = saved.lat;
    document.getElementById('lon').value = saved.lon;
  }
}

function askManual(reason) {
  document.getElementById('loc').textContent = reason;
  document.getElementById('out').innerHTML = '<div class="msg">Enter coordinates below.</div>';
  fillForm();
  showFormInline();
}

function useGps() {
  if (!navigator.geolocation) return askManual('Geolocation not supported');
  document.getElementById('loc').textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    pos => setLocation(pos.coords.latitude, pos.coords.longitude),
    err => askManual('Location unavailable (' + err.message + ')'),
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
  );
}

document.getElementById('manual').addEventListener('submit', e => {
  e.preventDefault();
  const lat = parseFloat(document.getElementById('lat').value);
  const lon = parseFloat(document.getElementById('lon').value);
  if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
    save({ lat, lon });
    setLocation(lat, lon, true);
  }
});
document.getElementById('gps').onclick = () => { save(null); closeDialog(); useGps(); };
$('cancel').onclick = closeDialog;
$('change').onclick = openDialog;
document.getElementById('prev').onclick = () => { day = startOfDay(addMin(day, -12 * 60)); render(); };
document.getElementById('next').onclick = () => { day = startOfDay(addMin(day, 36 * 60)); render(); };

render();
const saved = loadSaved();
fillForm();
if (saved) setLocation(saved.lat, saved.lon, true);
else useGps();
</script>
</body>
</html>
