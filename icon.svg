<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="neb" cx="25%" cy="20%" r="60%">
      <stop offset="0" stop-color="#5846a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5846a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f5e6bd"/>
      <stop offset="1" stop-color="#c9a865"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <clipPath id="body"><circle cx="92" cy="100" r="36"/></clipPath>
  </defs>

  <rect width="180" height="180" fill="url(#sky)"/>
  <rect width="180" height="180" fill="url(#neb)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="26" cy="132" r="1.6" opacity=".8"/>
    <circle cx="150" cy="36" r="2" />
    <circle cx="140" cy="150" r="1.4" opacity=".7"/>
    <circle cx="48" cy="58" r="1.2" opacity=".7"/>
    <circle cx="162" cy="104" r="1.3" opacity=".6"/>
    <circle cx="70" cy="160" r="1.1" opacity=".6"/>
    <circle cx="112" cy="22" r="1.2" opacity=".6"/>
  </g>
  <!-- sparkle star -->
  <path d="M150 26 Q151.2 34.8 160 36 Q151.2 37.2 150 46 Q148.8 37.2 140 36 Q148.8 34.8 150 26Z" fill="#fff"/>

  <!-- shooting star -->
  <line x1="18" y1="22" x2="62" y2="44" stroke="url(#streak)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ringed planet: back ring, body with bands, front ring -->
  <g transform="rotate(-18 92 100)">
    <ellipse cx="92" cy="100" rx="64" ry="15" fill="none" stroke="#9c8250" stroke-width="5"/>
    <circle cx="92" cy="100" r="36" fill="url(#planet)"/>
    <g clip-path="url(#body)" fill="#a8864a" opacity=".45">
      <rect x="50" y="86" width="90" height="5"/>
      <rect x="50" y="99" width="90" height="7"/>
      <rect x="50" y="113" width="90" height="4"/>
    </g>
    <path d="M28 100 A64 15 0 0 0 156 100" fill="none" stroke="#efe0b4" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
